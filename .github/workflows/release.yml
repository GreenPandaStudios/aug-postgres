name: Publish reviewed native package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUG_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.AUG_RELEASE_TAG }}
          path: release-source
          persist-credentials: false
      - name: Select native publication profile
        id: profile
        working-directory: release-source
        run: |
          mkdir -p .aug-build
          node --input-type=module <<'AUG_PROFILE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('aug-package.json'));
          const prefix='/releases/download/v'+manifest.version+'/';
          const reused=manifest.native.artifacts.every(a=>!new URL(a.url).pathname.includes(prefix));
          appendFileSync(process.env.GITHUB_OUTPUT,'reused='+reused+'\n');
          AUG_PROFILE
      - name: Verify unchanged native inputs and publish the source compatibility release
        if: steps.profile.outputs.reused == 'true'
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../scripts/publish-source-compatibility.mjs
      - name: Select reviewed candidate run
        if: steps.profile.outputs.reused != 'true'
        id: candidate
        working-directory: release-source
        run: |
          node --input-type=module <<'AUG_RUN'
          import assert from 'node:assert/strict';
          import {appendFileSync,readFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('aug-package.json'));
          const plan=JSON.parse(readFileSync('release-candidates.json'));
          assert.equal(process.env.AUG_RELEASE_TAG,'v'+manifest.version);
          assert.equal(plan.version,manifest.version);
          assert.ok(Number.isSafeInteger(plan.runId)&&plan.runId>0);
          appendFileSync(process.env.GITHUB_OUTPUT,'run='+plan.runId+'\n');
          AUG_RUN
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: steps.profile.outputs.reused != 'true'
        with:
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          pattern: native-candidate-*
          path: release-source/.aug-build/reviewed
      - name: Verify source contracts and assemble exact archives
        if: steps.profile.outputs.reused != 'true'
        working-directory: release-source
        run: node ../scripts/prepare-native-package-release.mjs .aug-build/reviewed
      - name: Publish only the verified archives
        if: steps.profile.outputs.reused != 'true'
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../scripts/publish-native-package-release.mjs
